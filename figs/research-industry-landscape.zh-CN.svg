<text x="454" y="251" font-size="13" font-weight="700" fill="#0f766e">06</text>
<text x="454" y="273" font-size="16" font-weight="400" fill="#1e293b">感知、定位与空间表示</text>
<rect x="442" y="324" width="332" height="86" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="454" y="349" font-size="13" font-weight="700" fill="#0f766e">07</text>
<text x="454" y="371" font-size="16" font-weight="400" fill="#1e293b">运动控制与动作学习</text>
