<text x="834" y="273" font-size="16" font-weight="400" fill="#1e293b">数据采集与治理</text>
<rect x="822" y="324" width="332" height="86" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="834" y="349" font-size="13" font-weight="700" fill="#7c3aed">11</text>
<text x="834" y="371" font-size="16" font-weight="400" fill="#1e293b">仿真与训练基础设施</text>
<rect x="822" y="422" width="332" height="86" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="834" y="447" font-size="13" font-weight="700" fill="#7c3aed">12</text>
<text x="834" y="469" font-size="16" font-weight="400" fill="#1e293b">评测、安全与部署运维</text>
<rect x="1188" y="168" width="360" height="570" rx="12" fill="#ffffff" stroke="#dbe3ed"/>
<rect x="1188" y="168" width="360" height="7" rx="3" fill="#c2410c" stroke="none"/>
<text x="1206" y="205" font-size="20" font-weight="700" fill="#c2410c">制造交付与应用</text>
<rect x="1202" y="226" width="332" height="86" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="1214" y="251" font-size="13" font-weight="700" fill="#c2410c">13</text>
<text x="1214" y="273" font-size="16" font-weight="400" fill="#1e293b">制造、集成与交付</text>
<rect x="1202" y="324" width="332" height="86" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="1214" y="349" font-size="13" font-weight="700" fill="#c2410c">14</text>
<text x="1214" y="371" font-size="16" font-weight="400" fill="#1e293b">应用与解决方案</text>
<rect x="48" y="768" width="1500" height="104" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="70" y="800" font-size="21" font-weight="700" fill="#1d4ed8">学术研究 → 方法创新、开放成果与受控评测</text>
<text x="70" y="838" font-size="21" font-weight="700" fill="#0f766e">产业实践 → 部件产品、开发平台、系统集成与运行证据</text>
<rect x="48" y="894" width="1500" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="70" y="923" font-size="19" font-weight="400" fill="#1e293b">场景需求与失败数据反向推动模型、本体和评测改进。</text>
<text x="70" y="950" font-size="17" font-weight="400" fill="#64748b">同一参与者可以跨多个环节；共同出现不代表供应关系或已验证兼容。</text>
<text x="48" y="1012" font-size="15" font-weight="400" fill="#64748b">分类框架与选定来源核对：2026-09-08</text>
</svg>
