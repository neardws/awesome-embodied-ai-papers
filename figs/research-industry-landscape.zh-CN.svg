<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img">
<title>具身智能学术与产业全景</title>
<rect width="1600" height="1050" fill="#f8fafc"/>
<style>text{font-family:"Arial","PingFang SC","Microsoft YaHei",sans-serif}</style>
<text x="48" y="62" font-size="34" font-weight="700" fill="#1e293b">具身智能：学术与产业全景</text>
<text x="48" y="99" font-size="20" font-weight="400" fill="#475569">14 个板块 · 87 个细类 · 硬件、软件与交付协同</text>
<text x="48" y="130" font-size="17" font-weight="400" fill="#64748b">围绕能力与问题组织；布局不表示市场份额或成熟度排名。</text>
<rect x="48" y="168" width="360" height="570" rx="12" fill="#ffffff" stroke="#dbe3ed"/>
<rect x="48" y="168" width="360" height="7" rx="3" fill="#2563eb" stroke="none"/>
