<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img">
<title>Embodied AI research and industry landscape</title>
<rect width="1600" height="1050" fill="#f8fafc"/>
<style>text{font-family:"Arial","PingFang SC","Microsoft YaHei",sans-serif}</style>
<text x="48" y="62" font-size="34" font-weight="700" fill="#1e293b">Embodied AI: research and industry</text>
<text x="48" y="99" font-size="20" font-weight="400" fill="#475569">14 domains · 87 subcategories · hardware, software and delivery</text>
<text x="48" y="130" font-size="17" font-weight="400" fill="#64748b">A taxonomy of capabilities and problems; not a market-share or maturity ranking.</text>
