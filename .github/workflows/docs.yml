name: Bilingual documentation
on:
  push:
    paths:
      - 'README*.md'
      - 'CONTRIBUTING*.md'
      - 'docs/**'
      - 'figs/**'
      - 'sources/**'
      - 'scripts/*.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README*.md'
      - 'CONTRIBUTING*.md'
      - 'docs/**'
      - 'figs/**'
      - 'sources/**'
      - 'scripts/*.py'
      - '.github/workflows/docs.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_docs.py
